# This workflow runs cruft update on all templated sponsored affiliated packages
# and opens PRs from the SunPyBot forks. It uses two fine-grained PATs:
# - BOT_FORK_PAT: scoped to SunPyBot's forks (contents: read/write)
# - BOT_PR_PAT: scoped to sunpy org repos (pull requests: read/write, contents: read)
# and also a classic PAT to allow maintainer access to PRs

name: Update all packages with package template

on:
  push:
  workflow_dispatch:
  schedule:
    #        ┌───────── minute (0 - 59)
    #        │ ┌───────── hour (0 - 23)
    #        │ │ ┌───────── day of the month (1 - 31)
    #        │ │ │ ┌───────── month (1 - 12 or JAN-DEC)
    #        │ │ │ │ ┌───────── day of the week (0 - 6 or SUN-SAT)
    - cron: '0 7 * * 1'  # Every Monday at 7am UTC

concurrency:
  group: cruft-update
  cancel-in-progress: false

permissions: {}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      repo_list: ${{ steps.set-repos.outputs.repo_list }}

    steps:
      - name: Set repo list
        id: set-repos
        run: |
          # echo 'repo_list=["sunpy/sunpy","sunpy/ndcube","sunpy/sunkit-magex","sunpy/streamtracer","sunpy/sunkit-dem","sunpy/mpl-animators","sunpy/sunkit-image","sunpy/sunkit-pyvista","sunpy/sunkit-instruments","sunpy/drms","sunpy/sunraster","sunpy/sunkit-spex","sunpy/radiospectra"]' >> "$GITHUB_OUTPUT"
          echo 'repo_list=["sunpy/mpl-animators"]' >> "$GITHUB_OUTPUT"

  update:
    name: Update ${{ matrix.repo }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.setup.outputs.repo_list) }}

    permissions:
      contents: read

    environment:
      name: global-cruft-update
      deployment: false

    env:
      REPO_FULL: ${{ matrix.repo }}
      BOT: "SunPyBot"
      BRANCH: "cruft/update"

    steps:
      - name: Set safe repo name
        id: safe
        run: echo "name=${REPO_FULL//\//-}" >> "$GITHUB_OUTPUT"

      - name: Setup fork and check existing PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.BOT_FORK_PAT }}
          BOT_FORK_PAT: ${{ secrets.BOT_FORK_PAT }}
        run: |
          REPO_NAME="${REPO_FULL#*/}"

          # Create fork if it doesn't exist
          FORK_EXISTS=$(gh api "repos/${BOT}/${REPO_NAME}" --jq '.full_name' 2>/dev/null || echo "")
          if [ -z "$FORK_EXISTS" ]; then
            echo "Creating fork..."
            gh api "repos/${REPO_FULL}/forks" -X POST
            sleep 10
          fi

          # Check if there's an open PR from this branch
          EXISTING_PR=$(gh pr list --repo "$REPO_FULL" --head "$BRANCH" --state open --author "$BOT" --json number --jq '.[0].number // 0' 2>/dev/null)

          # Create branch on fork if it doesn't exist
          BRANCH_EXISTS=$(gh api "repos/${BOT}/${REPO_NAME}/branches/${BRANCH}" --jq '.name' 2>/dev/null || echo "")
          if [ -z "$BRANCH_EXISTS" ]; then
            echo "Creating branch ${BRANCH} on fork..."
            gh api "repos/${BOT}/${REPO_NAME}/git/refs" \
              -X POST \
              -f ref="refs/heads/${BRANCH}" \
              -f sha="$(gh api "repos/${REPO_FULL}/git/ref/heads/main" --jq '.object.sha')"
          fi

          echo "existing_pr=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          echo "fork_repo=$BOT/$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.existing.outputs.fork_repo }}
          ref: ${{ env.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install cruft
        run: python -m pip install git+https://github.com/Cadair/cruft@patch-p1

      - name: Check if update is available
        id: check
        run: |
          CHANGES=0
          if [ -f .cruft.json ]; then
            if ! cruft check; then
              CHANGES=1
            fi
          else
            echo "No .cruft.json file"
          fi
          echo "has_changes=$CHANGES" >> "$GITHUB_OUTPUT"

      - name: Run cruft update
        if: steps.check.outputs.has_changes == '1'
        id: cruft_update
        run: |
          CRUFT_OUTPUT=$(cruft update --skip-apply-ask --refresh-private-variables 2>&1) || true
          echo "$CRUFT_OUTPUT"

          if echo "$CRUFT_OUTPUT" | grep -q "Failed to cleanly apply the update, there may be merge conflicts"; then
            echo "merge_conflicts=1" >> "$GITHUB_OUTPUT"
          else
            echo "merge_conflicts=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect merge conflicts
        if: steps.check.outputs.has_changes == '1'
        id: conflicts
        env:
          STEPS_CRUFT_UPDATE_OUTPUTS_MERGE_CONFLICTS: ${{ steps.cruft_update.outputs.merge_conflicts }}
        run: |
          MERGE_CONFLICTS="${STEPS_CRUFT_UPDATE_OUTPUTS_MERGE_CONFLICTS}"
          # Also check for conflict markers in any tracked file
          if git grep -l '^<<<<<<< ' 2>/dev/null; then
            MERGE_CONFLICTS=1
          fi
          echo "merge_conflicts=$MERGE_CONFLICTS" >> "$GITHUB_OUTPUT"

      - name: Check if only .cruft.json is modified
        if: steps.check.outputs.has_changes == '1'
        id: cruft_json
        run: |
          git status --porcelain=1
          if [[ "$(git status --porcelain=1)" == " M .cruft.json" ]]; then
            echo "Only .cruft.json is modified. Exiting workflow early."
            echo "has_changes=0" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request if needed
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.cruft_json.outputs.has_changes == '1'
        with:
          token: ${{ secrets.BOT_PR_PAT }}
          branch-token: ${{ secrets.BOT_FORK_PAT }}
          commit-message: Run cruft update from package template
          committer: SunPyBot <sunpybot@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: ${{ env.branch }}
          delete-branch: false
          title: 'Updates from the package template'
          body: |
            This is an autogenerated PR, which will applies the latest changes from the [SunPy Package Template](https://github.com/sunpy/package-template).

            If this pull request has been opened as a draft there are conflicts which need fixing.\n\n**To run the CI on this pull request you will need to close it and reopen it.**"
          draft: ${{ steps.conflicts.outputs.merge_conflicts == '1' }}

      - name: Prepare status for collation
        if: always()
        env:
          STEPS_SAFE_OUTPUTS_NAME: ${{ steps.safe.outputs.name }}
          MATRIX_REPO: ${{ matrix.repo }}
          JOB_STATUS: ${{ job.status }}
          STEPS_CRUFT_JSON_OUTPUTS_HAS_CHANGES: ${{ steps.cruft_json.outputs.has_changes }}
          STEPS_CONFLICTS_OUTPUTS_MERGE_CONFLICTS: ${{ steps.conflicts.outputs.merge_conflicts }}
          STEPS_CREATE_PR_OUTPUTS_PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          mkdir -p status
          cat > status/${STEPS_SAFE_OUTPUTS_NAME}.json <<EOF
          {
            "repo": "${MATRIX_REPO}",
            "status": "${JOB_STATUS}",
            "has_changes": "${STEPS_CRUFT_JSON_OUTPUTS_HAS_CHANGES}",
            "merge_conflicts": "${STEPS_CONFLICTS_OUTPUTS_MERGE_CONFLICTS}",
            "pr_number": "${STEPS_CREATE_PR_OUTPUTS_PR_NUMBER}",
            "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: status-${{ steps.safe.outputs.name }}
          path: status/
          retention-days: 1

  # This ludicrous situation is a limitation of the fine-grained PATs created to do the previous job.
  # I don't want to add this to the previous job as I would like to reduce the complexity of the thing done inside this environment.
  allow-edits:
    name: Allow maintainer edit
    needs: [update, setup]
    if: ${{ always() && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: classic-pat
      deployment: false

    env:
      REPO_LIST: ${{ needs.setup.outputs.repo_list }}
      BOT: "SunPyBot"
      BRANCH: "cruft/update"

    steps:
      - name: Enable maintainer edits on recent bot PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.classic_pat }}
          script: |
            const repos = JSON.parse(process.env.REPO_LIST);

            for (const repo of repos) {
              const [owner, repoName] = repo.split('/');
              const prs = await github.rest.pulls.list({
                owner,
                repo: repoName,
                head: `${process.env.BOT}:${process.env.BRANCH}`,
                state: 'open',
                per_page: 1
              });

              if (prs.data.length > 0) {
                const prNumber = prs.data[0].number;
                await github.rest.pulls.update({
                  owner,
                  repo: repoName,
                  pull_number: prNumber,
                  maintainer_can_modify: true
                });
                console.log(`Enabled maintainer edits on ${repo}#${prNumber}`);
              }
            }

  collate:
    name: Collate results
    needs: [update, setup]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.build-summary.outputs.summary }}

    steps:
      - name: Download status artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: status/
          pattern: status-*
          merge-multiple: true

      - name: Build summary
        id: build-summary
        run: |
          SUMMARY="**[Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**

          | Repository | Status | Conflicts | PR | Logs |
          |------------|--------|-----------|----|------|"

          for file in status/*.json; do
            REPO=$(jq -r '.repo' "$file")
            STATUS=$(jq -r '.status' "$file")
            HAS_CHANGES=$(jq -r '.has_changes' "$file")
            MERGE_CONFLICTS=$(jq -r '.merge_conflicts' "$file")
            PR_NUM=$(jq -r '.pr_number' "$file")
            RUN_URL=$(jq -r '.run_url' "$file")

            if [ "$STATUS" = "success" ]; then
              STATUS_ICON="✅ Success"
            else
              STATUS_ICON="❌ Failed"
            fi

            if [ "$HAS_CHANGES" = "1" ]; then
              if [ "$MERGE_CONFLICTS" = "1" ]; then
                CONFLICT="⚠️ Conflicts"
              else
                CONFLICT="✅ No conflicts"
              fi
            else
              CONFLICT="— No changes"
            fi

            if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ] && [ "$PR_NUM" != "" ]; then
              PR_LINK="[#${PR_NUM}](https://github.com/${REPO}/pull/${PR_NUM})"
            else
              PR_LINK="—"
            fi

            SUMMARY="${SUMMARY}
          | ${REPO} | ${STATUS_ICON} | ${CONFLICT} | ${PR_LINK} | [Logs](${RUN_URL}) |"
          done

          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "summary=$(echo "$SUMMARY" | jq -Rs .)" >> "$GITHUB_OUTPUT"

  report-fail:
    name: Report failure
    if: failure()
    needs: [update, setup, collate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ needs.collate.outputs.summary }}
        run: |
          TITLE="Package template auto-update failed"
          LABEL="github_actions"

          BODY="[Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          The package template auto-update workflow completed with failures.

          $(echo "$SUMMARY" | jq -r .)"

          # Search for existing open issue
          EXISTING=$(gh search issues --repo ${{ github.repository }} --state open --match title "$TITLE" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING" ]; then
            gh issue create \
              --repo ${{ github.repository }} \
              --title "$TITLE" \
              --body "$BODY" \
              --label "$LABEL"
          else
            gh issue edit "$EXISTING" \
              --repo ${{ github.repository }} \
              --body "$BODY"
          fi
